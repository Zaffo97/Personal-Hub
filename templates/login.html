<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Personal Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#0f0f11;--surface:#17171a;--surface-off:#1e1e22;
  --border:#2a2a30;--text:#e8e8ed;--text-muted:#8a8a96;
  --primary:#7c6cf0;--primary-h:#9488f7;--error:#e05555;--error-dim:#3a1a1a}
[data-theme="light"]{--bg:#f4f4f8;--surface:#fff;--surface-off:#ededf2;
  --border:#dcdce4;--text:#1a1a24;--text-muted:#5a5a6a;
  --primary:#5b4fcc;--primary-h:#4540b0;--error:#c0392b;--error-dim:#fdeaea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:1rem;-webkit-font-smoothing:antialiased}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:2rem;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:.6rem;margin-bottom:1.5rem}
.logo-icon{width:38px;height:38px;background:var(--primary);border-radius:10px;
  display:flex;align-items:center;justify-content:center}
h1{font-size:1.1rem;font-weight:700}
p{font-size:.8rem;color:var(--text-muted);margin-top:.2rem}
label{display:block;font-size:.75rem;font-weight:600;color:var(--text-muted);margin:.9rem 0 .3rem}
input{width:100%;padding:.5rem .75rem;border-radius:10px;font-size:.85rem;
  background:var(--surface-off);border:1px solid var(--border);color:var(--text);
  font-family:inherit;transition:.15s}
input:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 15%,transparent)}
.btn{width:100%;padding:.55rem;border-radius:10px;font-size:.85rem;font-weight:700;
  background:var(--primary);color:#fff;border:none;cursor:pointer;margin-top:1.2rem;transition:.15s}
.btn:hover{background:var(--primary-h)}
.err{background:var(--error-dim);color:var(--error);border-radius:8px;
  padding:.5rem .75rem;font-size:.78rem;margin-top:.75rem;font-weight:600}
.hint{font-size:.72rem;color:var(--text-muted);text-align:center;margin-top:1rem;opacity:.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <div><h1>Personal Hub</h1><p>Accedi al tuo spazio</p></div>
  </div>
  <form method="POST">
    <label>Username</label>
    <input name="username" type="text" autocomplete="username" autofocus required placeholder="admin">
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password" required placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
    <button class="btn" type="submit">Entra</button>
  </form>
  {% if error %}<div class="err">&#9888;&#65039; {{ error }}</div>{% endif %}
  <p class="hint">Default: admin / admin123</p>
</div>
</body>
</html>
